[package]
name = "bitwarden-managed-settings"
description = """
Read access to managed settings, the configuration an organization's IT administrators enforce
through the host operating system's Unified Endpoint Management (UEM) channel.
Internal crate for the bitwarden crate. Do not use.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only OR LicenseRef-Bitwarden-SDK"
keywords.workspace = true

[features]
uniffi = [
    "bitwarden-core/uniffi",
    "bitwarden-managed-settings-types/uniffi",
] # Uniffi bindings
wasm = [
    "bitwarden-core/wasm",
    "bitwarden-managed-settings-types/wasm",
    "dep:bitwarden-ipc",
    "bitwarden-ipc/wasm",
    "dep:bitwarden-threading",
    "bitwarden-threading/wasm",
    "dep:js-sys",
    "dep:serde",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
] # WASM support

[dependencies]
bitwarden-core = { workspace = true }
bitwarden-ipc = { workspace = true, optional = true }
bitwarden-managed-settings-types = { workspace = true }
bitwarden-threading = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
# `float_roundtrip` parses every number to the nearest double, as `JSON.parse` does, so encoded
# values match the ones JavaScript clients produced from the same input.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-time = "1.1.0"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
