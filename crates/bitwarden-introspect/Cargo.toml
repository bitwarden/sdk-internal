[package]
name = "bitwarden-introspect"
description = """
Compile-time-gated runtime introspection of the SDK object graph, used to drive automated debugging tooling. Internal crate for the Bitwarden SDK.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only OR LicenseRef-Bitwarden-SDK"
keywords.workspace = true

[dependencies]
bitwarden-introspect-macro = { workspace = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[features]
## Switches `Debuggable<T>` to its lock-backed, writable form and makes the
## introspection surface live. Consumers enable this only in dev builds; with
## it off, `Debuggable<T>` is `#[repr(transparent)]` over `T` and costs nothing.
introspect = []
## The `IntrospectWrite` capability: path-addressed mutation of the object
## graph. Kept separate from read so the read path stays serde-free.
write = ["dep:serde", "dep:serde_json", "dep:thiserror"]
## `Introspect` impls for common leaf types from these external crates. Kept
## optional so consumers that don't use them don't pull in the dependency.
chrono = ["dep:chrono"]
uuid = ["dep:uuid"]

[lints]
workspace = true
