[package]
name = "bitwarden-autotype"
version.workspace = true
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only OR LicenseRef-Bitwarden-SDK"
keywords.workspace = true

[features]
wasm = [
    "bitwarden-ipc/wasm",
    "bitwarden-threading/wasm",
    "dep:bitwarden-threading",
    "dep:tsify",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]

[dependencies]
bitwarden-ipc = { workspace = true }
# Only used by the wasm bindings, for mapping an AbortSignal to a CancellationToken.
bitwarden-threading = { workspace = true, optional = true }
serde = { workspace = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
# Not referenced directly; consumed by the async `#[wasm_bindgen]` codegen.
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
