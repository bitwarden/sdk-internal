[package]
name = "bitwarden-importers"
description = """
Internal crate for the bitwarden crate. Do not use.
"""
exclude = ["**/fixtures"]

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only OR LicenseRef-Bitwarden-SDK"
keywords.workspace = true

[features]
# Re-exports the 1Password access module so the out-of-tree CLI can drive it against a real
# account. Never enable in production builds.
# TODO: Remove once the importer consumes the module directly.
test-utils = []
uniffi = [
    "dep:uniffi",
    "bitwarden-core/uniffi",
    "bitwarden-vault/uniffi",
    "bitwarden-exporters/uniffi",
]
wasm = [
    "bitwarden-collections/wasm",
    "bitwarden-ffi/wasm",
    "bitwarden-vault/wasm",
    "bitwarden-exporters/wasm",
    "dep:tsify",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]

[dependencies]
aes = { workspace = true }
aes-gcm = { workspace = true }
async-trait = { workspace = true }
bitwarden-api-api = { workspace = true }
bitwarden-collections = { workspace = true }
bitwarden-core = { workspace = true }
bitwarden-crypto = { workspace = true }
bitwarden-error = { workspace = true }
bitwarden-exporters = { workspace = true }
bitwarden-ffi = { workspace = true }
bitwarden-random = { workspace = true }
bitwarden-vault = { workspace = true }
cbc = { workspace = true }
chrono = { workspace = true, features = ["std"] }
crypto-bigint = { workspace = true }
data-encoding = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
icu_normalizer = { workspace = true }
keepass = { workspace = true }
p256 = { version = "=0.14.0", features = ["alloc", "ecdh", "pkcs8"], default-features = false }
pbkdf2 = { workspace = true, features = ["hmac"] }
rand = { workspace = true }
reqwest = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
url = { workspace = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
bitwarden-api-base = { workspace = true }
bitwarden-core = { workspace = true, features = ["internal", "test-fixtures"] }
keepass = { workspace = true, features = ["save_kdbx4"] }
tokio = { workspace = true, features = ["rt"] }
wiremock = { workspace = true }

[lints]
workspace = true
