[package]
name = "bitwarden-encrypted-migrator"
description = """
Internal crate for the bitwarden crate. Do not use.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only OR LicenseRef-Bitwarden-SDK"
keywords.workspace = true

[features]
default = []
wasm = [
    "bitwarden-core/wasm",
    "bitwarden-ffi/wasm",
    "bitwarden-member-administration/wasm",
    "bitwarden-organizations/wasm",
    "bitwarden-threading/wasm",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]

# Note: dependencies must be alphabetized to pass the cargo sort check in the CI pipeline.
[dependencies]
bitwarden-core = { workspace = true }
bitwarden-ffi = { workspace = true }
bitwarden-member-administration = { workspace = true }
bitwarden-organizations = { workspace = true }
bitwarden-threading = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
bitwarden-api-api = { workspace = true, features = ["mockall"] }
bitwarden-core = { workspace = true, features = ["internal", "test-fixtures"] }
bitwarden-crypto = { workspace = true }
bitwarden-state = { workspace = true }
bitwarden-test = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
