[package]
name = "bitwarden-crypto-sync-handler"
description = """
This crate is responsible for taking cryptographic items from incoming syncs, and writing them to disk.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only OR LicenseRef-Bitwarden-SDK"
keywords.workspace = true

[features]
default = []
uniffi = ["bitwarden-core/uniffi", "dep:uniffi"]
wasm = [
    "bitwarden-core/wasm",
    "bitwarden-crypto/wasm",
    "bitwarden-ffi/wasm",
    "dep:tsify",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]

# Note: dependencies must be alphabetized to pass the cargo sort check in the CI pipeline.
[dependencies]
async-trait = { workspace = true }
bitwarden-api-api = { workspace = true }
bitwarden-core = { workspace = true, features = ["internal"] }
bitwarden-crypto = { workspace = true }
bitwarden-ffi = { workspace = true }
bitwarden-sync = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
bitwarden-api-api = { workspace = true, features = ["mockall"] }
bitwarden-core = { workspace = true, features = ["internal-test-utils"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
