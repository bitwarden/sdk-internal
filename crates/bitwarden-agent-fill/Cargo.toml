[package]
name = "bitwarden-agent-fill"
description = """
Internal crate for the bitwarden crate. Do not use.
"""

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only OR LicenseRef-Bitwarden-SDK"
keywords.workspace = true

[features]
uniffi = [
    "bitwarden-core/uniffi",
    "bitwarden-crypto/uniffi",
    "bitwarden-vault/uniffi",
    "dep:bitwarden-uniffi-error",
    "dep:uniffi",
]
wasm = [
    "bitwarden-core/wasm",
    "bitwarden-crypto/wasm",
    "bitwarden-encoding/wasm",
    "bitwarden-error/wasm",
    "bitwarden-ffi/wasm",
    "bitwarden-vault/wasm",
    "dep:tsify",
    "dep:wasm-bindgen",
]

[dependencies]
bitwarden-core = { workspace = true, features = ["internal"] }
bitwarden-crypto = { workspace = true }
bitwarden-encoding = { workspace = true }
bitwarden-error = { workspace = true }
bitwarden-ffi = { workspace = true }
bitwarden-random = { workspace = true }
bitwarden-uniffi-error = { workspace = true, optional = true }
bitwarden-uuid = { workspace = true }
bitwarden-vault = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true }
uuid = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }

[lints]
workspace = true
