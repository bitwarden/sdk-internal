plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
}

// The directory with the host build of libbitwarden_uniffi. run.sh sets it.
def uniffiLibDir = findProperty('uniffiLibDir') ?: file('../../target/debug').path

sourceSets {
    test {
        kotlin {
            // Bindings generated by run.sh
            srcDir 'build/generated/uniffi'
        }
    }
}

dependencies {
    testImplementation 'net.java.dev.jna:jna:5.17.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'
    testImplementation 'junit:junit:4.13.2'
}

tasks.named('test') {
    systemProperty 'jna.library.path', uniffiLibDir
    // The SDK logs to stdout, which Gradle does not capture. Set RUST_LOG to see it.
    environment 'RUST_LOG', System.getenv('RUST_LOG') ?: 'off'
    // The tests run against a native library that Gradle does not track as an input.
    outputs.upToDateWhen { false }
    testLogging {
        events = ['passed', 'skipped', 'failed']
        exceptionFormat = 'full'
    }
}
