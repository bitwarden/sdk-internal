[package]
name = "bitwarden-access-connector"
description = "Bitwarden PAM access connector, which rotates managed credentials."

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license-file = "../../LICENSE_SDK.txt"
keywords.workspace = true

[[bin]]
name = "bwac"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bitwarden-access-token = { workspace = true }
bitwarden-api-api = { workspace = true }
bitwarden-api-base = { workspace = true }
bitwarden-commercial-marker = { workspace = true }
bitwarden-core = { workspace = true }
bitwarden-crypto = { workspace = true }
bitwarden-encoding = { workspace = true }
bitwarden-pam = { workspace = true }
bitwarden-sensitive-value = { workspace = true }
bitwarden-state = { workspace = true }
clap = { workspace = true, features = ["env"] }
http = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt", "test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
