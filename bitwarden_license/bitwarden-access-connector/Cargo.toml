[package]
name = "bitwarden-access-connector"
description = "Bitwarden PAM access connector, which rotates managed credentials."

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license-file = "../../LICENSE_SDK.txt"
keywords.workspace = true

[[bin]]
name = "bwac"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
bitwarden-api-base = { workspace = true }
bitwarden-commercial-marker = { workspace = true }
bitwarden-pam = { workspace = true }
bitwarden-pam-sealed = { workspace = true }
bitwarden-sensitive-value = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "time"] }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
wiremock = { workspace = true }

[lints]
workspace = true
