[package]
name = "bitwarden-access-connector"
description = "Bitwarden PAM access connector, which rotates managed credentials."

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license-file = "../../LICENSE_SDK.txt"
keywords.workspace = true

[[bin]]
name = "bwac"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bitwarden-access-token = { workspace = true }
bitwarden-api-api = { workspace = true }
bitwarden-api-base = { workspace = true }
bitwarden-commercial-marker = { workspace = true }
bitwarden-core = { workspace = true }
bitwarden-crypto = { workspace = true }
bitwarden-encoding = { workspace = true }
bitwarden-generators = { workspace = true }
bitwarden-pam = { workspace = true }
bitwarden-pam-sealed = { workspace = true }
bitwarden-sensitive-value = { workspace = true }
bitwarden-state = { workspace = true }
bitwarden-threading = { workspace = true }
bitwarden-vault = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["env"] }
http = { workspace = true }
ldap3 = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
toml = { version = ">=1.1.3, <2", default-features = false, features = ["parse", "serde", "std"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
bitwarden-test = { workspace = true }
tempfile = ">=3.27.0, <4"
tokio = { workspace = true, features = ["rt", "test-util"] }
wiremock = { workspace = true }

# Needs a live domain controller, so `cargo test` skips it unless the target is named.
[[test]]
name = "active_directory_integration"
test = false

# Needs a live server and seeder, so `cargo test` skips it unless the target is named.
[[test]]
name = "e2e"
test = false

[lints]
workspace = true
