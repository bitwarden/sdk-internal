name: Build access connector Docker image

on:
  workflow_dispatch:
  pull_request:
    paths:
      # Any Rust change can affect bwac, which builds from many of the workspace's crates.
      - ".cargo/**"
      - ".github/workflows/build-access-connector-docker.yml"
      - "bitwarden_license/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches:
      - "main"
      - "pam/uat"
    paths:
      - ".cargo/**"
      - ".github/workflows/build-access-connector-docker.yml"
      - "bitwarden_license/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build image - ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bitwarden_license/bitwarden-access-connector/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: bwac:test

      - name: Smoke test image
        run: |
          docker run --rm --read-only --cap-drop ALL bwac:test --version
          docker run --rm --read-only --cap-drop ALL bwac:test run --help > /dev/null

          code=0
          docker run --rm --read-only --cap-drop ALL bwac:test || code=$?
          if [ "${code}" -ne 1 ]; then
            echo "::error::bwac without a token exited with ${code}, expected 1"
            exit 1
          fi
