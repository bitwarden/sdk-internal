name: Rust tests

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:
  # Builds the build output cache for the new month on main, so pull requests don't wait for the
  # next merge to get a cache that is not shared with the previous month.
  schedule:
    - cron: "0 2 1 * *"

env:
  CARGO_TERM_COLOR: always
  # Debug info is not needed to run tests in CI and makes building the test binaries much slower,
  # especially on Windows. The test profile inherits this setting from the dev profile.
  CARGO_PROFILE_DEV_DEBUG: "0"

permissions:
  contents: read

jobs:
  ci-pass:
    name: Check if tests passed
    runs-on: ubuntu-24.04
    needs:
      - test
    steps:
      - name: Check if tests passed
        run: exit 0

  fetch-crates:
    name: Fetch crates
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_fetch-crates.yml
    secrets:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

  test:
    name: ${{ matrix.os }} / default
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    needs: fetch-crates
    # Aikido can't run on every OS in the matrix, so Cargo only uses the crates fetch-crates downloaded.
    env:
      CARGO_NET_OFFLINE: "true"
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
          # The binding crates only have platform-independent native tests, which run on Linux.
          # The iOS, Android and WASM targets they exist for are built in their own workflows.
          - os: macos-26
            exclude: --exclude bitwarden-uniffi --exclude uniffi-bindgen --exclude bitwarden-wasm-internal --exclude wasm-bindgen-cli-runner
          - os: windows-2022
            exclude: --exclude bitwarden-uniffi --exclude uniffi-bindgen --exclude bitwarden-wasm-internal --exclude wasm-bindgen-cli-runner

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # The generated API crates are large and only map requests and responses. Optimizing them
      # makes them the slowest crates to compile, while tests run no faster. Only CI skips it, so
      # local builds keep the dev profile from Cargo.toml.
      - name: Skip optimizing the generated API crates
        shell: bash
        run: |
          cat >> .cargo/config.toml <<'EOF'

          [profile.dev.package.bitwarden-api-api]
          opt-level = 0

          [profile.dev.package.bitwarden-api-identity]
          opt-level = 0
          EOF

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: v1-rust
          # The build output cache below restores target/, including the dependencies.
          cache-targets: false

      # After the cache restore, so this run's index entries replace any older cached ones.
      - name: Download crates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-crates
          path: ~/.cargo

      # The build output cache also holds the workspace crates, so a run only recompiles the crates
      # that changed and the crates that depend on them. Without any match, the run builds
      # everything, using the crate downloads restored by rust-cache above.
      - name: Cache build output
        uses: bitwarden/gh-actions/cargo-build-cache@main
        with:
          key: ${{ github.job }}
          path: "!target/**/*.profraw"

      - name: Build tests
        id: build
        run: cargo test --workspace --all-features --no-run ${{ matrix.exclude }}

      - name: Test
        run: cargo test --workspace --all-features ${{ matrix.exclude }}

      # Runs the #[ignore]d pwsh script-launcher tests. Serial because parallel hosts die together
      # on CI runners. The packages and features must match the step above so this reuses its build. Only
      # tests/scripting_integration.rs runs here, so #[ignore]d pwsh tests belong in that file.
      - name: Test (integration, requires pwsh)
        run: cargo test --workspace --all-features ${{ matrix.exclude }} --test scripting_integration -- --ignored --test-threads=1

  test-wasm:
    name: WASM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Rust Toolchain
        id: toolchain
        shell: bash
        run: |
          RUST_TOOLCHAIN="$(grep -oP '^channel.*"(\K.*?)(?=")' rust-toolchain.toml)"
          echo "RUST_TOOLCHAIN=${RUST_TOOLCHAIN}" | tee -a "${GITHUB_OUTPUT}"

      - name: Install rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "${{ steps.toolchain.outputs.RUST_TOOLCHAIN }}"
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: v1-rust

      - name: Set up Aikido Endpoint Protection
        uses: bitwarden/gh-actions/setup-aikido-endpoint-protection@main
        with:
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Test WASM
        run: cargo test --target wasm32-unknown-unknown -p bitwarden-wasm-internal -p bitwarden-threading -p bitwarden-error -p bitwarden-uuid -p bitwarden-ffi --all-features

      - name: Test WASM (browser, bitwarden-state)
        run: |
          export CHROMEDRIVER=$(which chromedriver)
          cargo test --target wasm32-unknown-unknown -p bitwarden-state --features wasm,browser-tests

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          prefix-key: v1-rust
          # The build output cache below restores target/, including the dependencies.
          cache-targets: false

      # The build output cache also holds the workspace crates, so a run only recompiles the crates
      # that changed and the crates that depend on them. Without any match, the run builds
      # everything, using the crate downloads restored by rust-cache above.
      # The -v1 suffix drops the .bin tools built before Aikido checked their downloads.
      - name: Cache build output
        uses: bitwarden/gh-actions/cargo-build-cache@main
        with:
          key: ${{ github.job }}-v1
          path: |
            !target/**/*.profraw
            .bin

      - name: Set up Aikido Endpoint Protection
        uses: bitwarden/gh-actions/setup-aikido-endpoint-protection@main
        with:
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Install cargo-run-bin
        run: cargo install cargo-run-bin --locked --version 1.7.4

      - name: Check cargo-binstall is not configured
        run: ./scripts/check-no-binstall.sh

      # Runs cargo directly in cargo-llvm-cov's show-env mode so the restored build output is kept.
      # Coverage data and test binaries left over from earlier builds are removed first, so only
      # this build ends up in the report. Runs the same targets as `cargo llvm-cov` (`--tests`).
      # Proc-macro crates are left out of the report: their code runs inside the compiler, so it is
      # only measured when the crates that use them are recompiled, which the cache usually avoids.
      - name: Generate coverage
        id: build
        run: |
          env_sh=$(cargo bin cargo-llvm-cov show-env --sh)
          eval "$env_sh"
          cargo bin cargo-llvm-cov clean --profraw-only
          cargo test --workspace --all-features --tests --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/coverage-build.json"
          ./scripts/ci-remove-stale-executables.sh "$RUNNER_TEMP/coverage-build.json"
          cargo test --workspace --all-features --tests
          cargo bin cargo-llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "crates/bitwarden-api-|crates/[^/]+-macro/"

      - name: Upload to codecov.io
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
