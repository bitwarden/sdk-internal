# This workflow is intended to be run when we need to build the WASM SDK and produce artifacts that require secrets
# when the PR source branch does not have access to secrets (e.g. a fork).
# This workflow will run in the context of the target of the PR and have access to secrets.
# It only runs when a user with write access adds the "ci:signed-build" label to a fork PR. Pushes to the PR branch
# (including "Update branch") do not trigger it. The label is removed once the build starts, so every new commit
# needs to be reviewed and labeled again.
# The build also requires an approving review from a user with write access on exactly the commit being built, so a
# commit pushed between the review and the label does not run.
# Only approve and add the label after reviewing the PR to ensure that no malicious code has been introduced,
# as it allows the code on the forked branch to have access to workflow secrets.

name: Build @bitwarden/sdk-internal (Fork PR)

on:
  pull_request_target:
    types: [labeled]
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  check-run:
    name: Check PR run
    if: ${{ github.event.label.name == 'ci:signed-build' && github.event.pull_request.head.repo.full_name != github.repository }}
    uses: bitwarden/gh-actions/.github/workflows/check-run.yml@main
    permissions:
      contents: read

  remove-label:
    name: Remove signed build label
    needs: check-run
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Remove label
        env:
          GH_TOKEN: ${{ github.token }}
          _PR_NUMBER: ${{ github.event.pull_request.number }}
        # Other fork build workflows share this label and may have already removed it.
        run: |
          if ! OUTPUT=$(gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$_PR_NUMBER/labels/ci%3Asigned-build" 2>&1); then
            if [[ "$OUTPUT" == *"HTTP 404"* ]]; then
              echo "Label already removed."
            else
              echo "$OUTPUT"
              exit 1
            fi
          fi

  check-approval:
    name: Check approval of the labeled commit
    needs: check-run
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require an approving review on the labeled commit
        env:
          GH_TOKEN: ${{ github.token }}
          _PR_NUMBER: ${{ github.event.pull_request.number }}
          _HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          approvers=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$_PR_NUMBER/reviews" \
            --jq ".[] | select(.state == \"APPROVED\" and .commit_id == \"$_HEAD_SHA\") | .user.login" | sort -u)
          for user in $approvers; do
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$user/permission" --jq .permission)
            if [[ "$permission" == "admin" || "$permission" == "write" ]]; then
              echo "Commit $_HEAD_SHA is approved by $user."
              exit 0
            fi
          done
          echo "::error::No approving review on commit $_HEAD_SHA from a user with write access. Approve the latest commit, then add the label again."
          exit 1

  run-workflow:
    name: Build @bitwarden/sdk-internal
    needs:
      - check-run
      - check-approval
    uses: ./.github/workflows/build-wasm-internal.yml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      id-token: write
